<div class="carousel">
  <div class="carousel__viewport">
    @for (image of images(); track image.alt; let i = $index) {
      <div class="carousel__slide" [class.carousel__slide--active]="i === activeIndex()">
        @if (image.src) {
          <img [src]="image.src" [alt]="image.alt" />
        } @else {
          <!-- TODO: asigna "src" en la imagen del proyecto para reemplazar este placeholder -->
          <div class="carousel__placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <circle cx="9" cy="10" r="1.6" />
              <path d="m4 17 5-5 3.5 3.5L17 11l3 3" />
            </svg>
            <span>{{ image.alt }}</span>
          </div>
        }
      </div>
    }

    @if (images().length > 1) {
      <button class="carousel__arrow carousel__arrow--prev" type="button" (click)="prev()" aria-label="Imagen anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <button class="carousel__arrow carousel__arrow--next" type="button" (click)="next()" aria-label="Siguiente imagen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
    }
  </div>

  @if (images().length > 1) {
    <div class="carousel__dots">
      @for (image of images(); track image.alt; let i = $index) {
        <button
          class="carousel__dot"
          type="button"
          [class.carousel__dot--active]="i === activeIndex()"
          (click)="goTo(i)"
          [attr.aria-label]="'Ir a imagen ' + (i + 1)"
        ></button>
      }
    </div>
  }
</div>
